<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Policy Simulation Research Demo</title>
<link rel="stylesheet" href="research_demo.css?v=demo-surface-20260811a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

<body>
<main class="demo-shell">
  <header class="demo-header">
    <a class="demo-brand" href="research_demo.html"><i data-lucide="waypoints"></i><span>POLICY EXPLORATION</span></a>
    <div class="demo-case"><span>Prepared demonstration</span><b>Expanded Child Tax Credit</b></div>

    <button class="demo-step" data-stage="pathways"><b>04</b><span>Branching simulation</span></button>

  <section id="demoApp" class="demo-app" aria-live="polite"></section>
